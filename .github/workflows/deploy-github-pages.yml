name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages site
        env:
          GITHUB_PAGES: "true"
        run: pnpm build

      - name: Upload Pages artifact
        # v3 uses upload-artifact@v4, which is compatible with deploy-pages@v4.
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

      - name: Wait for Pages artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "$count" -ge 1 ]; then
              echo "Pages artifact is available after attempt ${attempt}."
              exit 0
            fi
            echo "Pages artifact is not visible yet (attempt ${attempt}/12); waiting 5 seconds."
            sleep 5
          done
          echo "Pages artifact did not become available in time."
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
