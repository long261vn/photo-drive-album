<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đang mở Album…</title>
    <script>
      (function () {
        var base = '/photo-drive-album/';
        var path = window.location.pathname;
        var route = path.indexOf(base) === 0 ? path.slice(base.length) : path.replace(/^\//, '');
        var target = base + '?route=' + encodeURIComponent('/' + route) + window.location.search.replace(/^\?/, '&') + window.location.hash;
        window.location.replace(target);
      }());
    </script>
  </head>
  <body></body>
</html>
